<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathEpi Academic & Research Manager Assistant</title>
    <meta
      name="description"
      content="AIMS RIC MathEpi academic calendar, course, lecturer, tutor, and Google Sheets/Drive operations assistant."
    />
    <meta name="theme-color" content="#8d111c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MathEpi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="assets/aims-ric-logo.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=19" />
  </head>
  <body>
    <div id="app"></div>
    <script src="auth/firebase-config.js"></script>
    <script src="auth/auth-bridge.js?v=17"></script>
    <script src="app.js?v=22"></script>
    <script>
      (function () {
        function showBootFallback() {
          var app = document.getElementById("app");
          if (!app || app.innerHTML.replace(/\s/g, "")) return;
          app.innerHTML =
            '<main style="min-height:100vh;padding:32px;font-family:Arial,sans-serif;background:#f8f8f5;color:#101828">' +
            '<section style="max-width:760px;margin:48px auto;padding:28px;border:1px solid #dedbd3;border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(16,24,40,.08)">' +
            '<p style="margin:0 0 10px;color:#8d111c;font-weight:800;letter-spacing:.08em;text-transform:uppercase">MathEpi Review Portal</p>' +
            '<h1 style="margin:0 0 14px;font-size:32px;line-height:1.15">The page needs a refresh reset</h1>' +
            '<p style="font-size:18px;line-height:1.55;color:#475467">Your browser may be holding an old cached copy of the review tool. Use the button below to clear the site cache and reopen the Tutorial Fellow reviews.</p>' +
            '<a href="./?reset=1#tf-reviews" style="display:inline-block;margin-top:18px;padding:14px 18px;border-radius:10px;background:#8d111c;color:#fff;text-decoration:none;font-weight:800">Reset and open reviews</a>' +
            '</section>' +
            '</main>';
        }

        window.addEventListener("error", function () {
          window.setTimeout(showBootFallback, 50);
        });
        window.addEventListener("unhandledrejection", function () {
          window.setTimeout(showBootFallback, 50);
        });
        window.addEventListener("load", function () {
          window.setTimeout(showBootFallback, 2500);
        });
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const params = new URLSearchParams(window.location.search);
          if (params.get("reset") === "1") {
            Promise.all([
              navigator.serviceWorker.getRegistrations().then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))),
              window.caches ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))) : Promise.resolve(),
            ]).finally(() => {
              params.delete("reset");
              const nextQuery = params.toString();
              const nextUrl = `${window.location.pathname}${nextQuery ? `?${nextQuery}` : ""}${window.location.hash || "#tf-reviews"}`;
              window.location.replace(nextUrl);
            });
            return;
          }
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
