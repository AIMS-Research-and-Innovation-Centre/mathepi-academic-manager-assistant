<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathEpi Academic & Research Manager Assistant</title>
    <meta
      name="description"
      content="AIMS RIC MathEpi academic calendar, course, lecturer, tutor, and Google Sheets/Drive operations assistant."
    />
    <meta name="theme-color" content="#8d111c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MathEpi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="assets/aims-ric-logo.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=20" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var APP_SCRIPT = "app.js?v=28";
        var AUTH_BRIDGE = "auth/auth-bridge.js?v=17";
        var booted = false;
        var resetDone = false;

        function appRoot() {
          return document.getElementById("app");
        }

        function reviewPortalUrl(includeReset) {
          var url = new URL("./tf-reviews/", window.location.href);
          if (includeReset) url.searchParams.set("reset", "1");
          url.searchParams.set("t", String(Date.now()));
          return url.toString();
        }

        function showBootFallback() {
          var app = appRoot();
          if (!app || app.innerHTML.replace(/\s/g, "")) return;
          var freshHref = reviewPortalUrl(false);
          var resetHref = reviewPortalUrl(true);
          app.innerHTML =
            '<main style="min-height:100vh;padding:32px;font-family:Arial,sans-serif;background:#f8f8f5;color:#101828">' +
            '<section style="max-width:760px;margin:48px auto;padding:28px;border:1px solid #dedbd3;border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(16,24,40,.08)">' +
            '<p style="margin:0 0 10px;color:#8d111c;font-weight:800;letter-spacing:.08em;text-transform:uppercase">MathEpi Review Portal</p>' +
            '<h1 style="margin:0 0 14px;font-size:32px;line-height:1.15">Open the review portal again</h1>' +
            '<p style="font-size:18px;line-height:1.55;color:#475467">The browser did not finish starting the review tool. Open a fresh copy first; use the cache reset only if the fresh copy still does not load.</p>' +
            '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px">' +
            '<a href="' + freshHref + '" style="display:inline-block;padding:14px 18px;border-radius:10px;background:#8d111c;color:#fff;text-decoration:none;font-weight:800">Open fresh review portal</a>' +
            '<a href="' + resetHref + '" style="display:inline-block;padding:14px 18px;border-radius:10px;border:1px solid #8d111c;color:#8d111c;text-decoration:none;font-weight:800">Clear cache and retry</a>' +
            '</div>' +
            '</section>' +
            '</main>';
        }

        function showResetScreen() {
          var app = appRoot();
          if (!app) return;
          app.innerHTML =
            '<main style="min-height:100vh;padding:32px;font-family:Arial,sans-serif;background:#f8f8f5;color:#101828">' +
            '<section style="max-width:760px;margin:48px auto;padding:28px;border:1px solid #dedbd3;border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(16,24,40,.08)">' +
            '<p style="margin:0 0 10px;color:#8d111c;font-weight:800;letter-spacing:.08em;text-transform:uppercase">MathEpi Review Portal</p>' +
            '<h1 style="margin:0 0 14px;font-size:32px;line-height:1.15">Refreshing the review portal</h1>' +
            '<p style="font-size:18px;line-height:1.55;color:#475467">Clearing the old cached copy and reopening TF Reviews. This should only take a moment.</p>' +
            '</section>' +
            '</main>';
        }

        function hasParam(name) {
          return new RegExp("[?&]" + name + "=").test(window.location.search);
        }

        function loadScript(src, next) {
          var script = document.createElement("script");
          script.src = src;
          script.onload = function () {
            if (next) next();
          };
          script.onerror = function () {
            showBootFallback();
          };
          document.head.appendChild(script);
        }

        function loadApp() {
          if (booted) return;
          booted = true;
          loadScript("auth/firebase-config.js", function () {
            loadScript(AUTH_BRIDGE, function () {
              loadScript(APP_SCRIPT, function () {
                window.setTimeout(showBootFallback, 2500);
              });
            });
          });
        }

        function registerServiceWorker() {
          if (!("serviceWorker" in navigator)) return;
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        }

        function finishReset() {
          if (resetDone) return;
          resetDone = true;
          window.location.replace(reviewPortalUrl(false));
        }

        function resetSiteCache() {
          showResetScreen();
          var jobs = [];
          try {
            if ("serviceWorker" in navigator) {
              jobs.push(
                navigator.serviceWorker
                  .getRegistrations()
                  .then(function (registrations) {
                    return Promise.all(
                      registrations.map(function (registration) {
                        return registration.unregister();
                      })
                    );
                  })
              );
            }
          } catch (error) {}
          try {
            if (window.caches) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(
                    keys.map(function (key) {
                      return caches.delete(key);
                    })
                  );
                })
              );
            }
          } catch (error) {}
          if (jobs.length && window.Promise) Promise.all(jobs).then(finishReset).catch(finishReset);
          else finishReset();
          window.setTimeout(finishReset, 5000);
        }

        if (window.location.hash === "#tf-reviews" && !hasParam("reset")) {
          window.location.replace(reviewPortalUrl(false));
          return;
        }

        if (hasParam("reset")) {
          resetSiteCache();
          return;
        }

        window.addEventListener("error", function () {
          window.setTimeout(showBootFallback, 50);
        });
        window.addEventListener("unhandledrejection", function () {
          window.setTimeout(showBootFallback, 50);
        });
        window.addEventListener("load", function () {
          registerServiceWorker();
          window.setTimeout(showBootFallback, 2500);
        });
        loadApp();
      })();
    </script>
  </body>
</html>
